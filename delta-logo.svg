<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Delta — Built on Arc</title>
<desc>Logo showing a single trunk line splitting into three colored branches, next to the wordmark "delta" and a small "Built on Arc" badge.</desc>
<style>
  .word { fill:#0F172A; font-family: Arial, Helvetica, sans-serif; font-weight:700; }
  .badge-text { fill:#475569; font-family: Arial, Helvetica, sans-serif; font-weight:600; }
  .badge-bg { fill:none; stroke:#CBD5E1; }
  @media (prefers-color-scheme: dark) {
    .word { fill:#F8FAFC; }
    .badge-text { fill:#94A3B8; }
    .badge-bg { stroke:#334155; }
  }
</style>

<!-- icon: single flow splitting into three -->
<g stroke-linecap="round" fill="none">
  <line x1="120" y1="195" x2="120" y2="128" stroke="#8B5CF6" stroke-width="13"/>
  <path d="M120,128 L64,52" stroke="#8B5CF6" stroke-width="9"/>
  <path d="M120,128 L120,42" stroke="#3B82F6" stroke-width="9"/>
  <path d="M120,128 L176,52" stroke="#14B8A6" stroke-width="9"/>
</g>
<circle cx="64" cy="46" r="11" fill="#8B5CF6"/>
<circle cx="120" cy="36" r="11" fill="#3B82F6"/>
<circle cx="176" cy="46" r="11" fill="#14B8A6"/>

<!-- wordmark -->
<text x="220" y="130" font-size="58" class="word">delta</text>

<!-- built on arc badge -->
<rect x="222" y="150" width="150" height="30" rx="15" class="badge-bg" stroke-width="1.2"/>
<text x="247" y="170" font-size="13" class="badge-text">Built on Arc</text>
</svg>
