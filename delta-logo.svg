<svg width="640" height="220" viewBox="0 0 640 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Delta — Built on Arc</title>
  <desc>Minimal geometric delta logo symbol with automated money-flow branching nodes, next to wordmark delta and Built on Arc badge.</desc>
  <defs>
    <linearGradient id="deltaWideGrad" x1="20" y1="190" x2="180" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Delta Icon Mark -->
  <g transform="translate(10, 10)">
    <path d="M90 20L160 145C163.2 150.6 159.2 157.8 152.8 157.8H27.2C20.8 157.8 16.8 150.6 20 145L90 20Z" 
          stroke="url(#deltaWideGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M90 157.8V100M90 100L60 70M90 100L120 70" 
          stroke="url(#deltaWideGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="48" r="10" fill="#14B8A6"/>
    <circle cx="54" cy="60" r="9" fill="#8B5CF6"/>
    <circle cx="126" cy="60" r="9" fill="#3B82F6"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="125" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">delta</text>

  <!-- Built on Arc Badge -->
  <rect x="212" y="148" width="145" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <circle cx="228" cy="162" r="4" fill="#A855F7"/>
  <text x="238" y="167" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Built on Arc</text>
</svg>
